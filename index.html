<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Basic Webpage</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }
        header, footer {
            background: #333;
            color: #fff;
            padding: 15px;
        }
        main {
            background: #fff;
            padding: 20px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Webpage</h1>
    </header>

    <main>
        <h2>About This Page</h2>
        <p>This is a simple basic HTML webpage layout. You can customize the text, colors, and structure however you like.</p>
        
        <h3>Features Included:</h3>
        <ul>
            <li>Header section</li>
            <li>Main content area</li>
            <li>Footer</li>
        </ul>
    </main>

    <footer>
        <p>© 2025 My Website</p>
    </footer>

</body>
</html>
